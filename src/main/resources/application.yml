spring:
  application:
    name: nenestore-api

  datasource:
    url: jdbc:postgresql://localhost:5433/nenesport_db?sslmode=disable
    username: nenestore
    password: nenestore123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:nenestore-super-secret-key-2024-minimum-256-bits!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

google:
  sheets:
    spreadsheet-id: 13JG71z4WHQYay9VAGNiJNrVCH7UTaTta-eAk7A_fmQU
    credentials-file: classpath:sheetsCredentials.json

storage:
  images-path: ./images/