services:
  postgres:
    image: postgres:16
    container_name: nenesport_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nenesport_db
      POSTGRES_USER: nenestore
      POSTGRES_PASSWORD: nenestore123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
